<div class="prompt-improver-container">
  <div class="input-wrapper">
    <div class="text-input-container">
      <textarea id="originalPrompt" [(ngModel)]="originalPrompt"
        placeholder="Deixe-me ajudar a refinar o seu prompt. Qual é a sua ideia?" class="prompt-textarea"
        [disabled]="isLoading" (input)="autoResize()" (keydown)="onKeyDown($event)"></textarea>

      <div *ngIf="isLoading" class="inline-loading">
        <div class="jumping-dots-loader">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="input-actions">
        <button (click)="reset()" [disabled]="isLoading" class="reset-btn" title="Limpar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M3 6H21M10 6V4C10 3.46957 10.2107 2.96086 10.5858 2.58579C10.9609 2.21071 11.4696 2 12 2C12.5304 2 13.0391 2.21071 13.4142 2.58579C13.7893 2.96086 14 3.46957 14 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M14 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>

        <button (click)="improvePrompt()" [disabled]="isLoading || !originalPrompt.trim()" class="improve-btn"
          title="Melhorar Prompt">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19M12 5L6 11M12 5L18 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="showFloatingBox" class="backdrop-blur" (click)="closeFloatingBox()"></div>

  <div *ngIf="showFloatingBox && improvedPrompt" class="centered-prompt-container" [class.show]="showFloatingBox">
    <div class="prompt-card">
      <div class="prompt-header">
        <div class="header-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M9 12L11 14L15 10M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="header-text">
          <h3>Prompt Otimizado</h3>
          <p>Seu prompt foi aprimorado com a metodologia STAR</p>
        </div>
        <button class="close-btn" (click)="closeFloatingBox()" title="Fechar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <div class="prompt-content">
        <div class="prompt-text">
          <pre>{{ improvedPrompt }}</pre>
        </div>

        <div class="prompt-actions">
          <button class="copy-btn" (click)="copyToClipboard()" [class.copied]="isCopied">
            <span class="copy-icon">
              <svg *ngIf="!isCopied" width="16" height="16" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M5 15H4C2.89543 15 2 14.1046 2 13V4C2 2.89543 2.89543 2 4 2H13C14.1046 2 15 2.89543 15 4V5"
                  stroke="currentColor" stroke-width="2" />
              </svg>
              <svg *ngIf="isCopied" width="16" height="16" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </span>
            {{ isCopied ? 'Copiado!' : 'Copiar Prompt' }}
          </button>

          <div class="prompt-stats">
            <span class="stat-badge methodology">STAR</span>
            <span class="stat-badge chars">{{ improvedPrompt.length }} caracteres</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
